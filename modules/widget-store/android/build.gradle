plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.widgetstore'
version = '0.1.0'

dependencies {
  // Same version expo-background-task pins (it is already in the app via that
  // package, so this adds no new native code to the APK); needed to enqueue a
  // one-off BackgroundTaskWork from the widget's manual-refresh receiver.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  // expo-background-task ships as a prebuilt AAR from the autolinking local
  // maven repo (not a project include). NB: keep this pin in sync with the
  // expo-background-task version in package.json (currently ~57.0.12).
  implementation "host.exp.exponent:expo.modules.backgroundtask:57.0.12"
  implementation "androidx.core:core:1.15.0"
}

android {
  namespace "expo.modules.widgetstore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
