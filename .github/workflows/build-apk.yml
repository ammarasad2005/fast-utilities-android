name: Build Android APK

# Manual trigger only — no automatic runs on push/PR.
# Run it from the "Actions" tab → "Build Android APK" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Whats-new text shown in the in-app update banner
        required: false
        default: ''

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # pushing the updated version.json back + creating the GitHub Release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: |
          npx expo prebuild --platform android --no-install
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          # NOTE: use printf (not echo >>) so every property lands on its own
          # line — prebuild writes `expo.inlineModules.watchedDirectories=[]`
          # last, and a newline-less append corrupts it and breaks autolinking.
          printf '\norg.gradle.java.home=${{ env.JAVA_HOME }}\n' >> android/gradle.properties
          printf 'kotlin.daemon.jvmargs=-Xmx1024m\n' >> android/gradle.properties
          printf 'org.gradle.workers.max=2\n' >> android/gradle.properties
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m/' android/gradle.properties

      # FCM: write google-services.json from the repo secret AFTER prebuild
      # (prebuild regenerates /android from scratch — the file must land in
      # the fresh tree). The config plugin + gradle apply fire only when the
      # file exists, so without the secret set, the workflow pauses here with
      # a clear note instead of a cryptic failure.
      - name: Inject google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON repo secret is not set — APK will build WITHOUT FCM (local-15min-sync only). Add the secret and rebuild for push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
          python3 -c "import json; json.load(open('android/app/google-services.json')); print('json parses ✓, package:', json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])"

      # Release signing: restore the private keystore from Actions secrets and
      # inject a `release` signingConfig into the PREBUILT build.gradle (prebuild
      # regenerates that file from the Expo template every run, so the injection
      # must live here, not in the committed android/). When the env vars are
      # unset (local builds), the config falls back to the debug keystore.
      - name: Restore release keystore + inject signing config
        env:
          KEYSTORE_B64: ${{ secrets.FASTUTILITIES_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/fastutilities-release.jks
          test -s /tmp/fastutilities-release.jks || { echo "::error::keystore secret empty — debug fallback would silently ship"; exit 1; }
          echo "keystore restored: $(wc -c < /tmp/fastutilities-release.jks) bytes"
          python3 - <<'PYEOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          release_block = ('        release {\n'
              '            storeFile file(System.getenv("FASTUTILITIES_KEYSTORE") ?: "debug.keystore")\n'
              '            storePassword System.getenv("FASTUTILITIES_STORE_PASSWORD") ?: "android"\n'
              '            keyAlias System.getenv("FASTUTILITIES_KEY_ALIAS") ?: "androiddebugkey"\n'
              '            keyPassword System.getenv("FASTUTILITIES_KEY_PASSWORD") ?: "android"\n'
              '        }\n')
          close = '        }\n    }\n    buildTypes'
          assert close in s, 'signingConfigs close anchor missing (template changed?)'
          s = s.replace(close, '        }\n' + release_block + '    }\n    buildTypes')
          # NB: the template's release buildType already assigns debug signing
          # AFTER the comment line — replace THAT assignment (later assignment
          # would win), don't just insert before it.
          bt = 'signed-apk-android.\n            signingConfig signingConfigs.debug'
          assert bt in s, 'release buildType anchor missing (template changed?)'
          s = s.replace(bt, 'signed-apk-android.\n            signingConfig signingConfigs.release')
          open(p, 'w').write(s)
          assert 'signingConfig signingConfigs.release' in s and 'FASTUTILITIES_KEYSTORE' in s
          print('signing config injected OK')
          PYEOF

      - name: Build release APK
        env:
          FASTUTILITIES_KEYSTORE: /tmp/fastutilities-release.jks
          FASTUTILITIES_STORE_PASSWORD: ${{ secrets.FASTUTILITIES_STORE_PASSWORD }}
          FASTUTILITIES_KEY_ALIAS: ${{ secrets.FASTUTILITIES_KEY_ALIAS }}
          FASTUTILITIES_KEY_PASSWORD: ${{ secrets.FASTUTILITIES_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fast-utilities-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Sideload distribution: attach the APK to a GitHub Release and update
      # version.json on main. The installed app polls that file (raw github)
      # and, when its versionCode is newer, downloads the release APK and
      # installs in place via the system installer.
      - name: Publish release + update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./app.json').expo.version")
          VC=$(node -p "require('./app.json').expo.android.versionCode")
          TAG="v$VER"
          # Human-friendly asset name (user decision). NOTE: gh release upload
          # sanitizes spaces to dots, so the canonical name uses dots outright —
          # URL-safe with no %-encoding hazards for the updater.
          ASSET_NAME="FAST.Utilities.apk"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "/tmp/$ASSET_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$ASSET_NAME" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET_NAME" \
              --title "FAST Utilities $VER" \
              --notes "${RELEASE_NOTES:-Automated build (versionCode $VC).}"
          fi

          node -e "
            const fs = require('fs');
            const out = {
              versionCode: $VC,
              apkUrl: 'https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME',
              notes: (process.env.RELEASE_NOTES || '').trim() || 'New FAST Utilities build is available.',
              publishedAt: new Date().toISOString().slice(0, 10),
            };
            fs.writeFileSync('version.json', JSON.stringify(out, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update version.json for $TAG"
            # workflow_dispatch only, and the version.json write is the sole
            # commit — no risk of a build loop.
            git pull --rebase "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "${{ github.ref_name }}" || true
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:${{ github.ref_name }}"
          fi
